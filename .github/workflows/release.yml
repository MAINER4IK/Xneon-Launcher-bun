name: Windows experimental pre-release

on:
  workflow_dispatch:
    inputs:
      publish_run_id:
        description: 'Successful validation run on v1.0.8-pre1 to publish'
        type: string
        required: false
  push:
    tags:
      - 'v1.0.8-pre1'

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'MAINER4IK/Xneon-Launcher-bun' && !inputs.publish_run_id
    runs-on: windows-2022
    env:
      HUTCH_NO_UPDATE_CHECK: '1'
      BUN_OPTIONS: --no-env-file
      XNLC_SKIP_LOCAL_DOTENV: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Check target
        run: |
          if ('${{ runner.arch }}' -ne 'X64') { throw 'Windows x64 required' }
          if ((bun --version) -ne '1.4.4') { throw 'Unexpected Bun version' }
      - name: Install Hutch 0.29.0
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'hutch-install.ps1'
          Invoke-WebRequest -Uri 'https://hutch.blackboard.sh/hutch/install.ps1' -OutFile $installer
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne '185CC615D3D1B6E7156C104BEB902CCE3F4B9F35CB3D14DF047586AA432883E7') {
            throw 'Hutch bootstrap checksum mismatch'
          }
          & $installer -Version 0.29.0 -NoModifyPath
          $bin = Join-Path $env:USERPROFILE '.hutch/bin'
          if ((& (Join-Path $bin 'hutch.exe') --version) -ne '0.29.0') { throw 'Unexpected Hutch version' }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $bin
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build Windows x64
        run: bun run build
      - uses: actions/upload-artifact@v5
        with:
          name: windows-x64-candidate
          path: release-electrobun/stable/*
          if-no-files-found: error
          retention-days: 1

  validate:
    needs: build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/download-artifact@v5
        with:
          name: windows-x64-candidate
          path: candidate
      - name: Validate artifact and prepare manual download
        run: bun scripts/validate-pre-release.ts candidate verified
      - uses: actions/upload-artifact@v5
        with:
          name: windows-x64-verified
          path: verified/*
          if-no-files-found: error
          retention-days: 3

  verify_previous:
    if: github.repository == 'MAINER4IK/Xneon-Launcher-bun' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_run_id != ''
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Verify source run and tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.publish_run_id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]]
          root="repos/$GITHUB_REPOSITORY"
          tag=$(gh api "$root/git/ref/tags/v1.0.8-pre1" --jq '.object.sha')
          commit=$(gh api "$root/git/tags/$tag" --jq '.object.sha')
          workflow=$(gh api "$root/actions/workflows/release.yml" --jq '.id')
          gh api "$root/actions/runs/$RUN_ID" |
            jq -e --arg sha "$commit" --argjson workflow "$workflow" '
              .workflow_id == $workflow and .head_sha == $sha and
              .head_branch == "v1.0.8-pre1" and .conclusion == "success"
            ' >/dev/null
          gh api "$root/actions/runs/$RUN_ID/jobs" |
            jq -e 'any(.jobs[]; .name == "validate" and .conclusion == "success")' >/dev/null
      - uses: actions/download-artifact@v5
        with:
          name: windows-x64-verified
          path: verified
          github-token: ${{ github.token }}
          run-id: ${{ inputs.publish_run_id }}
      - name: Recheck verified artifact
        working-directory: verified
        run: |
          set -euo pipefail
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 2
          expected=$(sha256sum xneon-launcher-1.0.8-pre1-win-x64.exe)
          test "$(cat SHA256SUMS.txt)" = "$expected"
      - uses: actions/upload-artifact@v5
        with:
          name: windows-x64-verified
          path: |
            verified/xneon-launcher-1.0.8-pre1-win-x64.exe
            verified/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: >-
      ${{ always() && !cancelled() && github.repository == 'MAINER4IK/Xneon-Launcher-bun' &&
          ((github.event_name == 'push' && github.ref == 'refs/tags/v1.0.8-pre1' && needs.validate.result == 'success') ||
           (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.verify_previous.result == 'success')) }}
    needs: [validate, verify_previous]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: windows-x64-verified
          path: verified
      - name: Recheck downloadable bytes
        working-directory: verified
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish experimental pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.8-pre1
          name: 1.0.8-pre1
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          body: |
            Experimental Windows x64 build for controlled manual testing.
            In-app updates are disabled. The installer is supplied for manual installation.
            Windows VM lifecycle, signed manifests, downgrade protection and remaining security work are pending.
            This build does not include private OAuth client credentials.
          files: |
            verified/xneon-launcher-1.0.8-pre1-win-x64.exe
            verified/SHA256SUMS.txt
