name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-1.4.4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}

      - name: Install Hutch
        shell: pwsh
        run: |
          & ([scriptblock]::Create((Invoke-RestMethod https://hutch.blackboard.sh/hutch/install.ps1))) -Version 0.29.0
          Add-Content -LiteralPath $env:GITHUB_PATH -Value (Join-Path $env:USERPROFILE ".hutch/bin")

      - name: Configure git.xneon.org npm registry auth
        env:
          FORGEJO_NPM_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        shell: pwsh
        run: |
          if ($env:FORGEJO_NPM_TOKEN) {
            Add-Content -LiteralPath .npmrc -Value "//git.xneon.org/api/packages/MAINER4IK/npm/:_authToken=$env:FORGEJO_NPM_TOKEN"
          }

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build app
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          DROPBOX_CLIENT_ID: ${{ secrets.DROPBOX_CLIENT_ID }}
          YANDEX_CLIENT_ID: ${{ secrets.YANDEX_CLIENT_ID }}
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
          ELY_CLIENT_ID: ${{ secrets.ELY_CLIENT_ID }}
          ELY_CLIENT_SECRET: ${{ secrets.ELY_CLIENT_SECRET }}
          ELY_DEVICE_CLIENT_ID: ${{ secrets.ELY_DEVICE_CLIENT_ID }}
          XN_CLIENT_ID: ${{ secrets.XN_CLIENT_ID }}
          XN_CLIENT_SECRET: ${{ secrets.XN_CLIENT_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_DEVICE_CLIENT_ID: ${{ secrets.MICROSOFT_DEVICE_CLIENT_ID }}
        run: bun run build

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: Xneon-Launcher-Windows
          path: |
            release-electrobun/stable/*
            !release-electrobun/stable/*-Setup.zip
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # git cliff строит ченджлог по истории и тегам: без fetch-depth: 0 он не увидит
      # предыдущий релиз и выдаст пустой результат.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      # Ченджлог через git cliff: только коммиты от предыдущего тега до текущего,
      # без заголовка/подвала — он идёт телом релиза ниже.
      - name: Generate changelog (git cliff)
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.git-cliff.outputs.content }}
          files: artifacts/*
          fail_on_unmatched_files: true
